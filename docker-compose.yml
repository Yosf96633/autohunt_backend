services:
  postgres:
    image: postgres:latest
    container_name: autohunt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - autohunt_pgdata:/var/lib/postgresql  # ← remove /data for pg18

volumes:
  autohunt_pgdata: